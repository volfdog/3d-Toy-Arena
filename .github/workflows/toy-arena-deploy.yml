
name: Toy Football - Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: toy-arena-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Unpack Toy Football 0.3
        shell: bash
        run: |
          set -euo pipefail
          test -f Toy_Football_Godot_v0_3.zip || { echo "Missing Toy_Football_Godot_v0_3.zip"; exit 1; }
          unzip -q Toy_Football_Godot_v0_3.zip -d work
          test -f work/Toy_Football_Godot_v0_3/project.godot
          cat > work/Toy_Football_Godot_v0_3/export_presets.cfg <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          EOF

      - name: Import and build Web version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          godot --headless --editor --import --path work/Toy_Football_Godot_v0_3
          godot --headless --path work/Toy_Football_Godot_v0_3 --export-release "Web" "$GITHUB_WORKSPACE/site/index.html"
          test -s site/index.html
          touch site/.nojekyll

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4




