name: Toy Football - Automatic Godot Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: toy-football-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Find latest Toy Football archive and unpack
        id: game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re, zipfile
          archives = glob.glob('Toy_Football_Godot_v*.zip')
          pattern = re.compile(r'^Toy_Football_Godot_v(\d+(?:_\d+)*)\.zip$')
          candidates = []
          for path in archives:
              match = pattern.fullmatch(os.path.basename(path))
              if match:
                  candidates.append((tuple(int(n) for n in match.group(1).split('_')), path))
          if not candidates:
              raise SystemExit('No Toy_Football_Godot_v*.zip found in repository root')
          _, archive = max(candidates)
          print('Selected archive:', archive)
          os.makedirs('work', exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  target = os.path.abspath(os.path.join('work', member.filename))
                  if not target.startswith(os.path.abspath('work') + os.sep):
                      raise SystemExit('Unsafe archive path: ' + member.filename)
              z.extractall('work')
          projects = glob.glob('work/**/project.godot', recursive=True)
          if len(projects) != 1:
              raise SystemExit(f'Expected one project.godot in archive, found {projects}')
          project_dir = os.path.dirname(projects[0])
          print('Godot project:', project_dir)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'project_dir={project_dir}\n')
          PY

      - name: Create Web export preset
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.game.outputs.project_dir }}
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          EOF

      - name: Import project and export Web build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.game.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p site
          godot --headless --editor --import --path "$PROJECT_DIR"
          godot --headless --path "$PROJECT_DIR" --export-release Web "$GITHUB_WORKSPACE/site/index.html"
          test -s site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
